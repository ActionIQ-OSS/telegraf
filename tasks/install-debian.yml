---
- name: Install any necessary dependencies [Debian/Ubuntu]
  apt: 
    name: "{{ telegraf_debian_ubuntu_dependencies }}"
    state: present 
    update_cache: yes 
    cache_valid_time: 3600

- name: Install any pip dependencies [Debian/Ubuntu]
  pip:
    name: "{{ item }}"
  with_items:
    - pyOpenSSL
    - ndg-httpsclient
    - pyasn1

# Updated 2026-01-08 per https://www.influxdata.com/blog/package-signing-key-rotation/
# Using /usr/share/keyrings path for compatibility with influxdata-archive-keyring package
# Note: aiq_packages_pip role may have already configured this, these tasks are idempotent

- name: Create keyrings directory [Debian/Ubuntu]
  file:
    path: /usr/share/keyrings
    state: directory
    mode: '0755'
  when: telegraf_install_url is not defined or telegraf_install_url == None

- name: Download InfluxData GPG Key [Debian/Ubuntu]
  get_url:
    url: "{{ telegraf_influxdata_base_url }}/influxdata-archive.key"
    dest: "/tmp/influxdata-archive.key"
    mode: '0644'
  when: telegraf_install_url is not defined or telegraf_install_url == None

- name: Convert GPG key to dearmored format and install [Debian/Ubuntu]
  shell: cat /tmp/influxdata-archive.key | gpg --dearmor > /usr/share/keyrings/influxdata-archive.gpg
  args:
    creates: /usr/share/keyrings/influxdata-archive.gpg
  when: telegraf_install_url is not defined or telegraf_install_url == None

- name: Add InfluxData repository [Debian/Ubuntu]
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/influxdata-archive.gpg] {{ telegraf_influxdata_base_url }}/debian stable main"
    state: present
    filename: "influxdata"
  when: telegraf_install_url is not defined or telegraf_install_url == None

- name: Install Telegraf packages [Debian/Ubuntu]
  apt: 
    name: telegraf
    state: latest
    update_cache: yes 
    cache_valid_time: 3600
  when: telegraf_install_url is not defined or telegraf_install_url == None
  
- name: Download Telegraf package via URL [Debian/Ubuntu]
  command: curl -o /tmp/telegraf-ansible-download.deb {{ telegraf_install_url }}
  when: telegraf_install_url is defined and telegraf_install_url != None

- name: Install downloaded Telegraf package [Debian/Ubuntu]
  apt:
    deb: /tmp/telegraf-ansible-download.deb
    state: present
  when: telegraf_install_url is defined and telegraf_install_url != None
